spring:
  application:
    name: devpath-gateway
  cloud:
    gateway:
      server:
        webflux:
          # 하위 서비스(platform-svc 공개 경로)도 CORS 를 붙이므로 게이트웨이 CorsWebFilter 와 겹치면
          # Access-Control-Allow-Origin 이 두 번 실려 브라우저가 차단한다(2026-09-17 운영 실측,
          # leva.ai.kr/updates). 엣지에서 같은 값을 하나로 줄인다.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
          routes:
            - id: platform-release-oauth
              uri: ${PLATFORM_URI:http://localhost:8081}
              predicates:
                - Path=/oauth2/authorization/github
                - Header=X-Candidate-Spec-Sha256, [0-9a-f]+
                - Header=X-Release-Run-Key, [A-Za-z0-9_-]+
              filters:
                - SetPath=/oauth2/authorization/release
            - id: platform-release-browser
              uri: ${PLATFORM_URI:http://localhost:8081}
              predicates:
                - Path=/v1/release/browser/**
                - Header=X-Candidate-Spec-Sha256, [0-9a-f]+
                - Header=X-Release-Run-Key, [A-Za-z0-9_-]+
            - id: platform-auth
              uri: ${PLATFORM_URI:http://localhost:8081}
              predicates:
                - Path=/oauth2/**,/login/**,/auth/**,/users/**,/admin/**,/consents/**,/beta/**,/ads/**,/support/**,/mentor-access/**
            - id: learning
              uri: ${LEARNING_URI:http://localhost:8082}
              predicates:
                - Path=/onboarding/assessments/**,/learning-paths/**,/dashboard/**,/contents/**
            - id: sandbox
              uri: ${SANDBOX_URI:http://localhost:8085}
              predicates:
                - Path=/sandbox/**
            - id: ai-review
              uri: ${AI_SVC_URI:http://localhost:8084}
              predicates:
                - Path=/reviews/**,/ai-mentor/**
            - id: community
              uri: ${COMMUNITY_SVC_URI:http://localhost:8086}
              predicates:
                - Path=/community/**
            - id: notification
              uri: ${NOTIFICATION_URI:http://localhost:8088}
              predicates:
                - Path=/notifications/**
            - id: lcs
              uri: ${LCS_SVC_URI:http://localhost:8087}
              predicates:
                - Path=/lcs/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway
